version: 1.3.9
cache: true

interface:
  customWelcome: 'ai_sky 已连接到 NS2E ChatGPT Plus 网关。'
  fileSearch: false

endpoints:
  agents:
    allowedProviders:
      - 'NS2E'
    capabilities:
      - 'deferred_tools'
      - 'execute_code'
      - 'web_search'
      - 'artifacts'
      - 'actions'
      - 'context'
      - 'tools'
      - 'chain'
      - 'ocr'
  custom:
    - name: 'NS2E'
      apiKey: '${NS2E_API_KEY}'
      baseURL: '${NS2E_BASE_URL}'
      models:
        default:
          - 'gpt5.5'
          - 'gpt-5.4'
          - 'gpt-5.3-codex'
          - 'gpt-5.2-codex'
          - 'gpt-5.1-codex'
          - 'gpt-5-codex'
          - 'gpt-5'
          - 'gpt-4o'
        fetch: false
      titleConvo: true
      titleModel: 'gpt5.5'
      titleMethod: 'completion'
      titlePrompt: |-
        请根据下面的对话内容生成一个简洁的简体中文标题。
        标题必须以简体中文为主，不要生成英文句子；只输出标题本身，不要解释，不要加引号，不要包含标点，不超过 20 个汉字。

        对话：
        {convo}
      titlePromptTemplate: |-
        用户：{input}
        助手：{output}
      summarize: false
      summaryModel: 'gpt5.5'
      modelDisplayLabel: 'NS2E'
      dropParams:
        - 'stop'

fileConfig:
  endpoints:
    NS2E:
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - 'image/.*'
        - 'application/pdf'
        - 'text/plain'
        - 'text/markdown'
        - 'application/msword'
        - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    default:
      totalSizeLimit: 20
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
  imageGeneration:
    percentage: 100
    px: 1024
